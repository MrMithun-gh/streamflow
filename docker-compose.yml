services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: streamflow-kafka
    ports:
      - "9092:9092"            # host access (your producer on Windows)
    environment:
      # This node is both broker and controller (KRaft mode, no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Three listeners: containers, your host, and internal controller traffic
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single broker, so replication factors must be 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Defaults for topics that get auto-created
      KAFKA_NUM_PARTITIONS: 3

      # Limit memory so we don't starve an 8 GB machine
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - streamflow-net

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s


  postgres:
    image: postgres:16
    container_name: streamflow-postgres
    ports:
      - "${POSTGRES_PORT}:5432"   # host 5433 -> container 5432

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pg_data:/var/lib/postgresql/data

    networks:
      - streamflow-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  spark:
    image: apache/spark:3.5.3
    container_name: streamflow-spark
    user: root                       # dev simplification: avoids volume permission issues

    command: ["sleep", "infinity"]   # idle container; we run jobs via docker exec

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092      # INTERNAL listener, not localhost
      KAFKA_TOPIC: ${KAFKA_TOPIC}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432                       # container port, not 5433
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./spark:/app/spark                    # your code, editable from Windows
      - ./checkpoints:/app/checkpoints        # Spark progress files
      - spark_ivy:/tmp/.ivy                   # caches downloaded connector jars

    mem_limit: 2g

    networks:
      - streamflow-net


volumes:
  kafka_data:
  pg_data:
  spark_ivy:


networks:
  streamflow-net:
    driver: bridge
